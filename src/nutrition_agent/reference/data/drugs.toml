# 用藥類別（16 類）與其有效成分。範圍以 docs/legacy/v1-scope-checklist.md §1 為準。
# role：rule_bearing = 規則型（會觸發判定）；coverage_only = 覆蓋型（不觸發規則，但藥名對照必須認得）。
# group：高血壓／糖尿病／高血脂／慢性關節炎／慢性失眠症各自一組，腸胃用藥獨立（不佔疾病名額）。
# 慢性病不過濾藥名對照，group 只用於說明，不用於篩選。
# Ranitidine 因 NDMA 汙染已全球下架，刻意不收錄。

version = "2026.10.0"

[[class]]
