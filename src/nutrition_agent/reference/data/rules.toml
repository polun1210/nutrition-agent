# 退役（2026-10-19 人工審查）：不核准作為 v1 通用規則，不可進入正式判定；也不建立「PPI 與鈣錯開幾小時」規則。
# 不核准原因：NIH ODS 只把 PPI 列為可能相關的藥物；直接吸收試驗結果不一致，2019 年隨機雙盲試驗未見具臨床意義的差異；
# 2022 年 ACG GERD 指引不建議無骨病風險者例行補鈣或維生素 D；仿單警示限於長期或高劑量使用、骨質疏鬆風險，
# 或低血鎂造成的次發性低血鈣。現有輸入模型沒有療程、劑量、骨骼風險，無法安全建立條件式規則。
# 這不代表「PPI 絕不影響鈣」，只是目前資料無法支持一條通用提醒。
reason_zh = "已退役、不核准：現有證據只把質子幫浦抑制劑列為可能相關的藥物，各項研究結果不一致，且只在長期或高劑量、有骨質疏鬆風險等條件下才有仿單警示，目前的輸入資料無法判斷這些條件。"
status = "retired"

