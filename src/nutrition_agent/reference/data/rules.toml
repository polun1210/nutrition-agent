requires_supplement_intake = false
advice = "inform_provider"
reason_zh = "這個降血糖藥可能減少身體對維生素 B12 的吸收，使血中濃度偏低；即使沒有補充也值得讓醫療人員知道。"
status = "approved"
approved_by = "PolunChao"

[[rule.citations]]
