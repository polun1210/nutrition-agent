# 交互作用規則（真實資料）。
# 狀態：草稿（draft）、審定（approved）、退役（retired，不進入判定）。判定引擎只讀審定規則。
# 審定只能由開發者手動標記，並同時填 approved_by；agent 只能草擬，不能審定。
# 2026-10-19 人工審查：審定 10 條、退役 5 條，目前沒有草稿。
#
# 明確排除（不草擬規則，2026-10-19 人工審查）：
# - COX-2 選擇性抑制劑（celecoxib、etoricoxib）× 鐵：已取得的 Celecoxib、Etoricoxib 仿單只在 PRECISION 試驗提到
#   源自腸胃道的缺鐵性貧血，且 celecoxib 比 naproxen／ibuprofen 少；沒有支持「鐵流失」提醒的原文。
#   傳統 NSAIDs 的腸胃出血證據不得直接套用到這一類。
# - COX-2 選擇性抑制劑 × 魚油 n-3／維生素 E（出血加成）：兩種仿單都沒有提到魚油、omega-3 或維生素 E，
#   NIH ODS 維生素 E HP 版也沒有提到這一類藥。維生素 E 保留為目標營養素，只做超量檢查。
# 每條規則的欄位與不變式見 src/nutrition_agent/reference/rules.py，出處引文會被完整性檢查逐字比對。
# 出處只用 NIH ODS HealthProfessional 版（TFDA 仿單 raw 尚未取得，沒有引用）。
# 錯開時數：原文都沒有針對這些組合明載，所以全部不填。

