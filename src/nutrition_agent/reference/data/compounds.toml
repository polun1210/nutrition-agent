# 鈣、鎂、鐵常見化合物的元素比率（標示只寫化合物重量時，用來推估元素量）。
# 每列必附分子量計算式（molecular_weight_expr）與元素質量計算式（element_mass_expr）；
# element_ratio = element_mass / molecular_weight，四捨五入到小數 4 位，完整性檢查會重算比對。
# 原子量採 IUPAC 常用值：H 1.008、C 12.011、N 14.007、O 15.999、Mg 24.305、P 30.974、S 32.06、Ca 40.078、Fe 55.845。
# 結晶水（2026-10-19 人工決定）：標示未載明型態時，取常見型態中元素比率較高者——超量檢查寧可多算，不要少算。
# 硫酸亞鐵（乾燥／七水）、乳酸鈣（無水／五水）、磷酸氫鈣（無水／二水）差距大，另列兩種型態讓校對頁可選；
# 通用名稱對到比率較高的那一列。其餘化合物各型態差距小，或目前預設已是較高者（碳酸鎂正鹽、檸檬酸鎂無水、
# 甘胺酸鎂／亞鐵理論值，市售品實際比率通常較低）。乾燥硫酸亞鐵的結晶水約一到一點五個，以一水計。推估只是近似。
# 鋅等其他營養素不在表內：只標化合物時判定為「無法判定」。

