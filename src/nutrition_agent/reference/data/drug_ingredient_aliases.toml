# 成分對照表：TFDA 處方成分名稱（含鹽類／水合物）→ drugs.toml 的有效成分代碼。
# 比對時做 NFKC、忽略大小寫、壓縮空白。對不上的成分一律視為範圍外（藥名表的 out_of_scope 欄）。
# 刻意不收錄 Ranitidine。新增鹽類時，目標代碼必須存在於 drugs.toml。
# 這張表與藥名表（匯出結果）要一起改版；匯出時藥名表版本記錄的是 TFDA 快照日期。

