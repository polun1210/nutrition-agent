services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 照片物件儲存（S3 gateway）。一定要給金鑰：沒設金鑰時 SeaweedFS 的 S3 是匿名可讀寫。
  # bucket 由 API 啟動時建立。只發佈 S3 與 Filer（瀏覽 /buckets/photos/ 看物件），都只綁本機。
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-nutrition}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-nutrition-dev-secret}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://nutrition:nutrition@db:5432/nutrition
      S3_INTERNAL_ENDPOINT: http://seaweedfs:8333
      # presigned URL 用這個簽，必須是瀏覽器實際連的網址（簽章綁 host，不能寫 127.0.0.1）。
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nutrition}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-nutrition-dev-secret}
      # 本機開發堆疊；實際部署請改 production 並提供 SESSION_SECRET。
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

  web:
    build:
      context: web
      target: dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/package-lock.json

volumes:
  dbdata:
  seaweeddata:
