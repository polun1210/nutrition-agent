[project]
name = "nutrition-agent"
version = "0.1.0"
description = "保健食品與慢性病用藥的補充評估：VLM 讀標示、規則判定、RAG 組報告"
readme = "README.md"
authors = [
    { name = "PolunChao", email = "balloonchao@gmail.com" }
]
requires-python = ">=3.12"
# 執行時套件等各模組實作時再用 `uv add` 加入。
dependencies = [
    "pydantic>=2.14.1",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
