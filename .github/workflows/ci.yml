name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: 設定 GitHub Actions 建置快取
        run: |
          cat > compose.cache.yaml <<'YAML'
          services:
            api:
              build:
                cache_from:
                  - type=gha,scope=api
                cache_to:
                  - type=gha,scope=api,mode=max
            web:
              build:
                cache_from:
                  - type=gha,scope=web-${WEB_BUILD_TARGET:-dev}
                cache_to:
                  - type=gha,scope=web-${WEB_BUILD_TARGET:-dev},mode=max
          YAML
      - name: 建置開發環境
        env:
          COMPOSE_FILE: compose.yaml:compose.cache.yaml
        run: docker compose build
      - name: 建置正式版前端
        env:
          WEB_BUILD_TARGET: prod
        run: docker compose -f compose.yaml -f compose.prod.yaml -f compose.cache.yaml build web

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: nutrition
          POSTGRES_DB: nutrition
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nutrition:nutrition@127.0.0.1:5432/nutrition_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: nutrition
          POSTGRES_DB: nutrition
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://nutrition:nutrition@127.0.0.1:5432/nutrition_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
